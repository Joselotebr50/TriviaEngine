<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trivia Engine — Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .app { max-width: 600px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-size: 14px;
        }
        .lista-item {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .lista-item button { width: auto; padding: 8px 12px; background: #dc2626; }
        fieldset { border: 1px solid #e5e7eb; border-radius: 10px; margin: 15px 0; padding: 10px; }
        legend { font-weight: bold; padding: 0 6px; }
    </style>
</head>
<body>
    <div id="app" class="app"></div>
    <script type="module" src="admin.js"></script>
</body>
</html>
